# Default for new users: Postgres (Alpine) + API (Alpine) on one network.
# API: http://localhost:8000/docs
#
# Already have Postgres on the host (e.g. postgres-db on :5432)?
#   docker compose up api --build --no-deps
#   and set MINEVA_DATABASE_URL in .env to host.docker.internal (see .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineva_dev}
      POSTGRES_DB: mineva
    volumes:
      - mineva_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mineva"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mineva-api:alpine
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MINEVA_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-mineva_dev}@db:5432/mineva
    depends_on:
      db:
        condition: service_healthy

volumes:
  mineva_pg_data:
